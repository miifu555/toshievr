<script type="module">
  import * as eg from "https://js.sabae.cc/egvr.js";
  let cam = document.querySelector("a-camera");
  
  if (!cam) {
    cam = document.createElement("a-camera");
    cam.setAttribute("position", "0 1.6 0");
    document.querySelector("a-scene").appendChild(cam);
  }
  
  const cursor = document.createElement("a-cursor");
  cursor.setAttribute("fuse", "true");
  cursor.setAttribute("fuse-timeout", "1500");
  cursor.setAttribute("color", "red");
  cam.appendChild(cursor);

eg.sky("https://miifu555.github.io/toshievr/sabaestation.jpg")

const grass1 = eg.model("https://miifu555.github.io/toshievr/grasses.glb", 3, 0, 2, 90, 2);

grass1.addEventListener('click', () => {
  grass1.setAttribute('animation__up', {
    property: 'position',
    to: '3 5 2',        // Y座標を5まで上げる
    dur: 2000,          // 2秒かけて
    easing: 'easeInQuad'
  });

  grass1.setAttribute('animation__rotate', {
    property: 'rotation',
    to: '0 450 0',      // 元の90度から360度足して450度（1回転）
    dur: 2000,
    easing: 'linear'
  });
  
  grass1.addEventListener('animationcomplete__up', () => {
    grass1.parentNode.removeChild(grass1); // 自分自身をシーンから削除
  });
});

eg.model("https://miifu555.github.io/toshievr/grasses.glb", -3, 0,-1,40,0.3);
eg.model("https://miifu555.github.io/toshievr/grasses.glb", 0, 3,-1,10,0.3);
eg.model("https://miifu555.github.io/toshievr/touki.glb", 2, 0, -6,0,0.1);
eg.model("https://miifu555.github.io/toshievr/touki.glb", 4, 0, 3,0,0.1);

const p = eg.text("鯖江駅へようこそ!!", 0, 3, -3, 8, eg.rgb(255, 0, 0));
setInterval(() => {
  const b = eg.isNear(p, 3.0);
  p.setAttribute("visible", !b);
}, 1000 / 60);
  
const mymodel = eg.model("https://miifu555.github.io/toshievr/touki.glb", 0, 1, -2, 0, 0.5);
mymodel.addEventListener('loaded', () => {
  mymodel.setAttribute('rotation', '180 0 0'); 
  mymodel.setAttribute('animation', {
    property: 'position',
    from: '0 1.4 -2',
    to: '0 1.8 -2',
    dur: 2000,
    dir: 'alternate',
    loop: true,
    easing: 'easeInOutSine'
  });
});
  
eg.model("https://miifu555.github.io/toshievr/touki.glb", 0, 1, -2, 0, 0.5);
eg.image("https://miifu555.github.io/toshievr/syosaku.jpg", 0, 1.25, -2, 0.4, 0.4);
</script>
