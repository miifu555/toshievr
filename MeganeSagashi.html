<script type="module">
  import * as eg from "https://js.sabae.cc/egvr.js";

eg.sky("https://miifu555.github.io/toshievr/sabaest.jpg")
eg.model("https://miifu555.github.io/toshievr/grasses.glb", 3, 0,2,90,0.3);
eg.model("https://miifu555.github.io/toshievr/grasses.glb", -3, 0,-1,40,0.3);
eg.model("https://miifu555.github.io/toshievr/grasses.glb", 0, 3,-1,10,0.3);
eg.model("https://miifu555.github.io/toshievr/touki.glb", 2, 0, -6,0,0.1);
eg.model("https://miifu555.github.io/toshievr/touki.glb", 4, 0, 3,0,0.1);

const p = eg.text("鯖江駅へようこそ!!", 0, 3, -3, 8, eg.rgb(255, 0, 0));
setInterval(() => {
  const b = eg.isNear(p, 3.0);
  p.setAttribute("visible", !b);
}, 1000 / 60);

// 1. アニメーションするモデル（ここを -10 に）
const mymodel = eg.model("https://miifu555.github.io/toshievr/touki.glb", 0, 1, -10, 0, 0.5);
mymodel.setAttribute('animation', {
  property: 'position.y',
  // y座標のアニメーション範囲も必要に応じて調整
  from: 1.2,
  to: 1.6,
  dur: 2000,
  dir: 'alternate',
  loop: true,
  easing: 'easeInOutSine'
});

// 2. 静止しているモデル（ここも -10 にしないと、元の場所に残ってしまう）
eg.model("https://miifu555.github.io/toshievr/touki.glb", 0, 1, -10, 0, 0.5);

// 3. 重ねる画像（ここも -10 に合わせる）
eg.image("https://miifu555.github.io/toshievr/syosyuku.jpg", 0, 1.2, -10, 0.5, 0.4);


</script>
