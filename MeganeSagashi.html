<script type="module">
import * as eg from "https://js.sabae.cc/egvr.js";

// --- 1. スコア管理の仕組み (最初に行う) ---
let score = 0;
// 座標を少し手前(z=-2)にして、サイズを3に調整
const scoreText = eg.text("集めた数: 0", 0, 3, -2, 3, eg.rgb(255, 255, 255));

// スコアを更新する専用の命令
const updateScore = () => {
  score++;
  if (score >= 5) {
    scoreText.setAttribute("text", "value", "コンプリート！おめでとう！");
    scoreText.setAttribute("text", "color", "yellow");
  } else {
    scoreText.setAttribute("text", "value", "集めた数: " + score);
  }
};

// --- 2. カメラとカーソルの設定 ---
let cam = document.querySelector("a-camera");
if (!cam) {
  cam = document.createElement("a-camera");
  cam.setAttribute("position", "0 1.6 0");
  document.querySelector("a-scene").appendChild(cam);
}
const cursor = document.createElement("a-cursor");
cursor.setAttribute("fuse", "true");
cursor.setAttribute("fuse-timeout", "1000");
cursor.setAttribute("color", "red");
cam.appendChild(cursor);

eg.sky("https://miifu555.github.io/toshievr/sabaestation.jpg");

// --- 3. オブジェクトの設定 (共通化してミスを防ぐ) ---
const setupTarget = (obj, tx, ty, tz, trot) => {
  obj.addEventListener('click', () => {
    obj.setAttribute('animation__up', { property: 'position', to: `${tx} ${ty} ${tz}`, dur: 2000, easing: 'easeInQuad' });
    obj.setAttribute('animation__rotate', { property: 'rotation', to: `0 ${trot} 0`, dur: 2000, easing: 'linear' });
    
    // アニメーションが終わったら消してスコア加算
    obj.addEventListener('animationcomplete__up', () => {
      if (obj.parentNode) {
        obj.parentNode.removeChild(obj);
        updateScore(); // ここでスコアを増やす
      }
    });
  });
};

// 各モデルの登録
setupTarget(eg.model("https://miifu555.github.io/toshievr/grasses.glb", 3, 0, 2, 90, 1.5), 3, 3, 2, 450);
setupTarget(eg.model("https://miifu555.github.io/toshievr/grasses.glb", -3, 0, -1, 40, 1.5), -3, 3, -1, 400);
setupTarget(eg.model("https://miifu555.github.io/toshievr/grasses.glb", 0, 3, -1, 10, 1.5), 0, 6, -1, 370);
setupTarget(eg.model("https://miifu555.github.io/toshievr/touki.glb", 2, 0, -6, 0, 1), 2, 3, -6, 360);
setupTarget(eg.model("https://miifu555.github.io/toshievr/touki.glb", 4, 0, 3, 0, 1), 4, 3, 3, 360);

// --- 4. 装飾用モデル (浮遊するモデル) ---
const mymodel = eg.model("https://miifu555.github.io/toshievr/touki.glb", 0, 1.4, -2, 0, 0.5);
mymodel.addEventListener('loaded', () => {
  mymodel.setAttribute('rotation', '180 0 0'); 
  mymodel.setAttribute('animation', {
    property: 'position', from: '0 1.4 -2', to: '0 1.8 -2',
    dur: 2000, dir: 'alternate', loop: true, easing: 'easeInOutSine'
  });
});

eg.text("鯖江駅へようこそ!!", 0, 4, -3, 2, eg.rgb(255, 0, 0));
  
eg.model("https://miifu555.github.io/toshievr/touki.glb", 0, 1, -2, 0, 0.5);
eg.image("https://miifu555.github.io/toshievr/syosaku.jpg", 0, 1.25, -2, 0.4, 0.4);
</script>
